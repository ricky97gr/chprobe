syntax = "proto3";

package plugin;

option go_package = "./proto";

service PluginService {
  rpc GetPluginInfo(GetPluginInfoRequest) returns (GetPluginInfoResponse);
  rpc GetRoutes(GetRoutesRequest) returns (GetRoutesResponse);
  rpc HandleRequest(HandleRequestRequest) returns (HandleRequestResponse);
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  rpc GetMetricsSummary(GetMetricsSummaryRequest) returns (GetMetricsSummaryResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message GetPluginInfoRequest {}

message GetPluginInfoResponse {
  string id = 1;
  string name = 2;
  string version = 3;
  string author = 4;
  string description = 5;
}

message GetRoutesRequest {}

message GetRoutesResponse {
  repeated RouteInfo routes = 1;
}

message RouteInfo {
  string path = 1;
  string method = 2;
  string description = 3;
  string handler = 4;
  map<string, string> metadata = 5;
}

message HandleRequestRequest {
  string method = 1;
  string path = 2;
  map<string, string> data = 3;
}

message HandleRequestResponse {
  bool success = 1;
  map<string, string> data = 2;
  string error = 3;
}

message GetMetricsRequest {}

message GetMetricsResponse {
  map<string, string> metrics = 1;
}

message GetMetricsSummaryRequest {}

message GetMetricsSummaryResponse {
  map<string, string> summary = 1;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
  string name = 2;
  string version = 3;
  string description = 4;
  map<string, string> metadata = 5;
}
